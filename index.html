<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Moonbun Money</title>
  <meta name="description" content="A cute moon-themed budget tracker with Yutu the Jade Rabbit and Bao the treasure dragon.">
  <meta name="theme-color" content="#e9ddff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700;900&family=Mochiy+Pop+One&family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- hand-drawn wobble for the ink icons (used by CSS: .ic { filter: url(#ink-rough) }) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><pattern id="ic-tone" patternUnits="userSpaceOnUse" width="2.4" height="2.4"><rect width="2.4" height="2.4" fill="#fff"/><circle cx="1.2" cy="1.2" r=".5" fill="#2f2a33" fill-opacity=".38"/></pattern><filter id="ink-rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="1" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="ink-rough-lg" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="1" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
  <a class="skip" href="#view">Skip to content</a>
  <div class="stars" aria-hidden="true"></div>

  <!-- Sign-in screen (cloud mode only) -->
  <section id="auth" class="auth" hidden aria-labelledby="auth-title"></section>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-moon" aria-hidden="true"></span><span>Moonbun <b>Money</b><small lang="ja" aria-hidden="true">月うさぎの貯金箱</small></span></div>
      <nav class="month-nav" aria-label="Choose month">
        <button class="icon-btn" data-action="month-prev" aria-label="Previous month">‹</button>
        <span id="month-label" aria-live="polite"></span>
        <button class="icon-btn" data-action="month-next" aria-label="Next month">›</button>
      </nav>
      <button class="icon-btn" data-action="tab" data-tab="settings" aria-label="Settings"><svg class="ic ic-gear" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M12 3.5l1.6 1.9 2.4-.6.7 2.4 2.4.7-.6 2.4 1.9 1.6-1.9 1.6.6 2.4-2.4.7-.7 2.4-2.4-.6L12 20.5l-1.6-1.9-2.4.6-.7-2.4-2.4-.7.6-2.4L3.5 12l1.9-1.6-.6-2.4 2.4-.7.7-2.4 2.4.6z" fill="#e2d6ff" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 15.2c-2.6-1.6-3-3.6-1.6-4.3.8-.4 1.4 0 1.6.6.2-.6.8-1 1.6-.6 1.4.7 1 2.7-1.6 4.3z" fill="#ff7eb3"/></svg></button>
    </header>
    <div id="demo-banner" class="demo-banner" hidden>☾ Demo mode: your data is saved only on this device until Firebase is connected.</div>

    <main id="view" tabindex="-1"></main>

    <button class="fab" data-action="open-add" aria-label="Add a transaction"><span aria-hidden="true">＋</span></button>

    <nav class="tabbar" aria-label="Sections">
      <button data-action="tab" data-tab="home"><svg class="ic ic-moon" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5" fill="#fff1c2" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.2" cy="8.4" r="1.3" fill="#f3d98f"/><circle cx="16.4" cy="15.8" r="1.6" fill="#f3d98f"/> <circle cx="9.8" cy="12.3" r=".8" fill="var(--ic-line, #6b4672)"/><circle cx="14.2" cy="12.3" r=".8" fill="var(--ic-line, #6b4672)"/> <path d="M11.1 13.4 q.9 .9 1.8 0" fill="none" stroke="var(--ic-line, #6b4672)" stroke-width="1.1" stroke-linecap="round"/> <ellipse cx="8.600000000000001" cy="13.600000000000001" rx="1.2" ry=".7" fill="#ff9fb8" opacity=".85"/><ellipse cx="15.399999999999999" cy="13.600000000000001" rx="1.2" ry=".7" fill="#ff9fb8" opacity=".85"/><path d="M20.5 1.7999999999999998Q20.94 3.56 22.7 4Q20.94 4.44 20.5 6.2Q20.06 4.44 18.3 4Q20.06 3.56 20.5 1.7999999999999998Z" fill="#ffd166"/></svg>Home</button>
      <button data-action="tab" data-tab="spending"><svg class="ic ic-chart" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false"><circle cx="12" cy="12.5" r="8" fill="#ffd3e6" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 12.5V4.5a8 8 0 0 1 7.6 5.5z" fill="#bdf0d4" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 12.5l7.6-2.5a8 8 0 0 1-1.8 8z" fill="#e2d6ff" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Spending</button>
      <button data-action="tab" data-tab="plan"><svg class="ic ic-planner" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false"><rect x="5" y="4.5" width="14" height="16.5" rx="2.5" fill="#d6f0ff" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="9" y="3" width="6" height="3.4" rx="1.2" fill="#ffd3e6" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 10.5l1.2 1.2 2.2-2.4M8.5 15l1.2 1.2 2.2-2.4" fill="none" stroke="var(--ic-line, #6b4672)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.5 11h2.5M13.5 15.5h2.5" stroke="#9cc6e6" stroke-width="1.4" stroke-linecap="round"/></svg>Plan</button>
      <button data-action="tab" data-tab="hoard"><svg class="ic ic-chest" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false"><path d="M4 10.5h16v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="#f6c36b" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 10.5a8 5.5 0 0 1 16 0z" fill="#ffd98a" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 13h16" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="10.5" y="11.5" width="3" height="3.4" rx="1" fill="#fff1c2" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 2.3Q18.94 4.06 20.7 4.5Q18.94 4.94 18.5 6.7Q18.06 4.94 16.3 4.5Q18.06 4.06 18.5 2.3Z" fill="#ffd166"/><path d="M6 4Q6.3 5.2 7.5 5.5Q6.3 5.8 6 7Q5.7 5.8 4.5 5.5Q5.7 5.2 6 4Z" fill="#fff6d6"/></svg>Hoard</button>
      <button data-action="tab" data-tab="play"><svg class="ic ic-capsule" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false"><path d="M4.5 12a7.5 7.5 0 0 1 15 0z" fill="#ffb8d2" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 12h15a7.5 7.5 0 0 1-15 0z" fill="#ffffff" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="8.4" r="1.4" fill="#fff" opacity=".9"/><path d="M20 1.6Q20.48 3.52 22.4 4Q20.48 4.48 20 6.4Q19.52 4.48 17.6 4Q19.52 3.52 20 1.6Z" fill="#ffd166"/></svg>Play</button>
      <button data-action="tab" data-tab="history"><svg class="ic ic-scroll" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false"><path d="M7 5h11a2 2 0 0 1 0 4h-1v9a3 3 0 0 1-3 3H6a2 2 0 0 1 0-4h1z" fill="#fff4d6" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 10h5M9.5 13h5M9.5 16h3" stroke="#e0b76a" stroke-width="1.3" stroke-linecap="round"/><path d="M6 21a2 2 0 0 1 0-4h1" fill="none" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>History</button>
    </nav>
  </div>

  <!-- Quick add -->
  <dialog id="add-dialog" aria-labelledby="add-title">
    <form id="add-form" method="dialog" novalidate>
      <div class="dialog-head">
        <h2 id="add-title">Add to the ledger</h2>
        <button type="button" class="icon-btn" data-action="close-dialog" aria-label="Close">✕</button>
      </div>
      <fieldset class="seg" aria-label="Type">
        <legend class="sr-only">What kind?</legend>
        <label><input type="radio" name="type" value="expense" checked><span><svg class="ic ic-dango" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M5 20L19 5" stroke="#c89b6d" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="16.6" r="3.2" fill="#a6e8c4" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12.2" r="3.2" fill="#ffffff" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="7.8" r="3.2" fill="#ffb8d2" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> <circle cx="10.7" cy="12.2" r=".8" fill="var(--ic-line, #6b4672)"/><circle cx="13.3" cy="12.2" r=".8" fill="var(--ic-line, #6b4672)"/> <path d="M11.1 13.299999999999999 q.9 .9 1.8 0" fill="none" stroke="var(--ic-line, #6b4672)" stroke-width="1.1" stroke-linecap="round"/> <ellipse cx="9.5" cy="13.5" rx="1.2" ry=".7" fill="#ff9fb8" opacity=".85"/><ellipse cx="14.5" cy="13.5" rx="1.2" ry=".7" fill="#ff9fb8" opacity=".85"/></svg> Spent</span></label>
        <label><input type="radio" name="type" value="income"><span><svg class="ic ic-purse" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M4.5 10.5h15l-1 8.5a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8z" fill="#ffd3e6" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 10.5a4 4 0 0 1 8 0" fill="none" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10.6" cy="6.9" r="1.3" fill="#ffe08a" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="13.4" cy="6.9" r="1.3" fill="#ffe08a" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/> <circle cx="9.8" cy="15" r=".8" fill="var(--ic-line, #6b4672)"/><circle cx="14.2" cy="15" r=".8" fill="var(--ic-line, #6b4672)"/> <path d="M11.1 16.1 q.9 .9 1.8 0" fill="none" stroke="var(--ic-line, #6b4672)" stroke-width="1.1" stroke-linecap="round"/> <ellipse cx="8.600000000000001" cy="16.3" rx="1.2" ry=".7" fill="#ff9fb8" opacity=".85"/><ellipse cx="15.399999999999999" cy="16.3" rx="1.2" ry=".7" fill="#ff9fb8" opacity=".85"/></svg> Earned</span></label>
        <label><input type="radio" name="type" value="saving"><span><svg class="ic ic-coin" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5" fill="#ffe08a" stroke="var(--ic-line, #6b4672)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="6" fill="none" stroke="#e8b75a" stroke-width="1.2"/> <circle cx="9.9" cy="12" r=".8" fill="var(--ic-line, #6b4672)"/><circle cx="14.1" cy="12" r=".8" fill="var(--ic-line, #6b4672)"/> <path d="M11.1 13.1 q.9 .9 1.8 0" fill="none" stroke="var(--ic-line, #6b4672)" stroke-width="1.1" stroke-linecap="round"/> <ellipse cx="8.700000000000001" cy="13.3" rx="1.2" ry=".7" fill="#ff9fb8" opacity=".85"/><ellipse cx="15.299999999999999" cy="13.3" rx="1.2" ry=".7" fill="#ff9fb8" opacity=".85"/></svg> Saved</span></label>
      </fieldset>
      <button type="button" class="btn jade scan-btn" data-action="scan-receipt">Scan a receipt instead ✧</button>
      <label class="field amount-field">
        <span>Amount</span>
        <input name="amount" inputmode="decimal" autocomplete="off" placeholder="0.00" required aria-describedby="amount-err">
      </label>
      <p id="amount-err" class="err" role="alert"></p>
      <div class="when-expense">
        <span class="field-label" id="cat-label">Category</span>
        <div class="chips" role="radiogroup" aria-labelledby="cat-label" id="cat-chips"></div>
      </div>
      <label class="field when-saving">
        <span>Into which treasure?</span>
        <select name="goalId" id="goal-select"></select>
      </label>
      <label class="field">
        <span class="when-income-label">Note</span>
        <input name="note" maxlength="80" placeholder="boba with friends ♡">
      </label>
      <label class="field">
        <span>Date</span>
        <input name="date" type="date" required>
      </label>
      <div class="field receipt-field">
        <span>Receipt photo (optional)</span>
        <label class="receipt-pick"><input type="file" name="receipt" accept="image/*" capture="environment"><span class="receipt-btn">Add a photo ✧</span><img class="receipt-preview" alt="Receipt preview" hidden></label>
      </div>
      <button class="btn primary big" type="submit">Add it ✧</button>
    </form>
  </dialog>

  <!-- shared dialog for the gacha, the diary and Yutu's letters -->
  <dialog id="play-dialog" aria-labelledby="play-title"><div id="play-body"></div></dialog>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Rive web runtime (single-file build: the WebAssembly is inside, nothing else is fetched) -->
  <script src="https://cdn.jsdelivr.net/npm/@rive-app/canvas-single@2.50.0/rive.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
